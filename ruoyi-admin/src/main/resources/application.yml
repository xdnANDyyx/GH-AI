# ============================================
# Vertex AI 图片生成配置（gemini-3-pro-image）
# ============================================
vertex:
  ai:
    # Google Cloud 项目 ID
    project-id: project-56a8fdac-a9a9-4727-9bc
    # Vertex AI 区域（global / us-central1 / asia-southeast1 等）
    location: global
    # 模型名称
    model: gemini-3-pro-image
    # 反推提示词（图生文）使用的视觉文本模型
    # 生图模型 gemini-3-pro-image 只会返回图片不会返回描述文本，反推必须用支持图像理解的文本模型
    reverse-model: gemini-2.5-flash
    # 反推提示词（图生文）备用降级模型列表（英文逗号分隔）。当主模型发生 429 资源耗尽或 503 时，会自动按此顺序尝试。
    reverse-fallback-models: gemini-1.5-flash,gemini-1.5-pro,gemini-2.5-pro
    # 读超时（秒）
    read-timeout: 600
    # 默认宽高比（前端未传 extraOptions.aspect_ratio 时使用）
    # 注意：必须加引号！YAML 1.1 会把不加引号的 1:1 按六十进制解析成整数 61
    default-aspect-ratio: "1:1"
    # 默认图片尺寸（前端未传 extraOptions.image_size / size 时使用）
    default-image-size: 1K
    # GCP 服务账号 JSON 凭证文件路径（本地开发可设 GOOGLE_APPLICATION_CREDENTIALS 环境变量）
    credentials-path: /home/ubuntu/.config/gcloud/application_default_credentials.json
    # 新加坡 Squid 代理（仅 Vertex AI 生图接口使用）
    proxy:
      host: 43.160.202.223
      port: 3128
