# MyBatis配置
mybatis:
  # 搜索指定包别名
  typeAliasesPackage: com.ruoyi.**.domain
  # 配置mapper的扫描，找到所有的mapper.xml映射文件
  mapperLocations: classpath*:mapper/**/*Mapper.xml
  # 加载全局的配置文件
  configLocation: classpath:mybatis/mybatis-config.xml

# MyBatis-Plus配置
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl



# PageHelper分页插件
pagehelper:
  helperDialect: mysql
  supportMethodsArguments: true
  params: count=countSql

# Swagger配置
swagger:
  # 是否开启swagger
  enabled: true
  # 请求前缀
  pathMapping: /dev-api

# 防盗链配置
referer:
  # 防盗链开关
  enabled: false
  # 允许的域名列表
  allowed-domains: localhost,127.0.0.1,ruoyi.vip,www.ruoyi.vip

# 防止 XSS 攻击
xss:
  # 过滤开关
  enabled: true
  # 排除链接（多个用逗号分隔）
  excludes: /system/notice
  # 匹配链接
  urlPatterns: /system/*,/monitor/*,/tool/*

# 电商爬虫 API 配置（官方 API）
crawler:
  # 淘宝开放平台 API 配置
  taobao:
    appKey: your_taobao_appkey
    appSecret: your_taobao_appsecret
  # 京东联盟 API 配置
  jd:
    appKey: your_jd_appkey
    appSecret: your_jd_appsecret
  # 拼多多 API 配置
  pdd:
    clientId: your_pdd_client_id
    clientSecret: your_pdd_client_secret

# Knife4j增强配置
knife4j:
  enable: true
  setting:
    language: zh_cn
    swagger-model-name: '实体模型'
    enable-swagger-models: true
    enable-dynamic-parameter: true
    enable-document-manage: true
    enable-version: false
    enable-reload-cache-parameter: false
    enable-after-script: true
    enable-filter-multipart-api-method-type: POST
    enable-filter-multipart-apis: false
    enable-request-cache: true
    enable-host: false
    enable-host-text:
    enable-home-custom: true
    home-custom-path: classpath:markdown/home.md
    enable-search: true
    enable-open-api: true
    enable-debug: true
    enable-footer-custom: true
    footer-custom-content: Apache License 2.0 | Copyright © 2019-2026 RuoYi
  swagger:
