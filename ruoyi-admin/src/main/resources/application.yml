# 项目相关配置
ruoyi:
  # 名称
  name: RuoYi
  # 版本
  version: 3.9.1
  # 版权年份
  copyrightYear: 2026
  # 文件路径 示例（ Windows配置C:/GuangHeXDN/guanghe-server-xdn/uploadPath，Linux配置 /home/ruoyi/uploadPath）
  profile: C:/GuangHeXDN/guanghe-server-xdn/uploadPath
  # 获取ip地址开关
  addressEnabled: false
  # 验证码类型 math 数字计算 char 字符验证
  captchaType: math

# 开发环境配置
server:
  # 服务器的HTTP端口，默认为8080
  port: 8780
  servlet:
    # 应用的访问路径
    context-path: /
  tomcat:
    # tomcat的URI编码
    uri-encoding: UTF-8
    # 连接数满后的排队数，默认为100
    accept-count: 1000
    threads:
      # tomcat最大线程数，默认为200
      max: 800
      # Tomcat启动初始化的线程数，默认值10
      min-spare: 100

# 日志配置
logging:
  level:
    com.ruoyi: debug
    org.springframework: warn
    com.ruoyi.project.system.mapper: debug
    com.ruoyi.project.monitor.mapper: debug
    com.ruoyi.**.mapper: debug

# API请求日志配置
api-log:
  enabled: true

# 用户配置
user:
  password:
    # 密码最大错误次数
    maxRetryCount: 5
    # 密码锁定时间（默认10分钟）
    lockTime: 10

# Spring配置
spring:
  # 资源信息
  messages:
    # 国际化资源文件路径
    basename: i18n/messages
  profiles:
    active: druid
  # 文件上传
  servlet:
    multipart:
      # 单个文件大小
      max-file-size: 50MB
      # 设置总上传的文件大小
      max-request-size: 100MB
  # 服务模块
  devtools:
    restart:
      # 热部署开关
      enabled: false
  # 排除 Spring AI OpenAI 自动配置（使用自定义配置）
  autoconfigure:
    exclude:
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioSpeechAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioTranscriptionAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiEmbeddingAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiImageAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiModerationAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiChatAutoConfiguration
  ai:
    deepseek:
      api-key: sk-5305eb7cc1054949a29ce536fa38524f
      base-url: https://api.deepseek.com
      completions-path: /v1/chat/completions
      embeddings-path: /v1/embeddings
      chat:
        options:
          model: deepseek-chat
          temperature: 0.7
    doubao:
      api-key: 0a46ee59-c1f7-4511-934e-3efd00662125
      base-url: https://ark.cn-beijing.volces.com
      completions-path: /api/v3/chat/completions
      embeddings-path: /api/v3/embeddings
      chat:
        options:
          model: doubao-1-5-pro-32k-250115
          temperature: 0.7
    qwen-vl:
      api-key: ${QWEN_VL_API_KEY:}
      base-url: https://ws-imzx6fexjwni7vtk.cn-beijing.maas.aliyuncs.com/compatible-mode/v1
      completions-path: /chat/completions
      embeddings-path: /embeddings
      chat:
        options:
          model: qwen3-vl-plus
          temperature: 0.2
    jimeng:
      access-key: ${JIMENG_ACCESS_KEY:}
      secret-key: ${JIMENG_SECRET_KEY:}
      model: jimeng_t2i_v30
    kling:
      access-key: ${KLING_ACCESS_KEY:}
      secret-key: ${KLING_SECRET_KEY:}
      base-url: https://api-beijing.klingai.com
      model: kling-v3-omni
    openai302:
      api-key: 57gRQeZrnp7DihTYWhb8JGTpSUWkHB5djIQlzBJTNxBO0XkSS0E04380QiWimndT5
      base-url: https://api.stepfun.com/v1
      model: step-image-edit-2
    lightcc:
      api-key: E43e615Ec$32410d4b.22feeDA4c_584
